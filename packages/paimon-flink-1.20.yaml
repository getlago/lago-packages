# Apache Paimon's Flink 1.20 bundle and action jar, built from source — Lago build.
#
# The released bundle on Maven Central carries jackson-databind 2.14.x (two
# copies: paimon-shade's relocated one and avro's, which paimon-format shades
# with its pom.properties), paimon-shade's guava 30.1.1-jre and netty
# 4.1.100.Final, httpcore5 5.3.6 / httpclient5 5.5.1 (paimon-api, REST
# catalog) and protobuf-java 3.19.6 (paimon-format, ORC). No Paimon release
# moves any of them, so this builds from the release tag instead:
#
#   1. apache/paimon-shade's jackson, guava and netty modules, rebuilt on
#      current versions under a `-lago<n>` version so they can never pass for
#      the Apache artifacts. They are installed into a Maven repository local
#      to this build and not shipped on their own: the bundle shades them.
#   2. apache/paimon at the release tag, against those shades, with the
#      jackson BOM and the httpcomponents and protobuf versions set through
#      Maven properties, and with our source patches (debezium parsing, CDC
#      table options, the UpdateColumnNullability branch).
#
# Nothing here opens or rewrites a published jar: every jar in the apk is the
# output of `mvn package`.
#
# Consumed by flink-paimon-base, which puts the jars in /opt/flink/lib for
# getlago/lago-infrastructure images/flink-paimon.
package:
  name: paimon-flink-1.20
  version: 1.4.2
  epoch: 1
  description: >-
    Apache Paimon Flink 1.20 bundle and action jar, built from source with
    current jackson, guava, netty and httpcomponents and Lago's CDC
    patches. Lago build.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # The jars install into Flink's lib/ and are useless without it.
      - flink-1.20

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - git
      - maven-3.9
      # Paimon targets Java 8 bytecode and its CI builds on 8 and 11.
      - openjdk-11
      - openjdk-11-default-jdk
      - patch
  environment:
    JAVA_HOME: /usr/lib/jvm/java-11-openjdk
    MAVEN_OPTS: -Xmx3g

vars:
  # Latest GA of each line when this was written (2026-10-30). Take the latest
  # GA again on a bump; the CVE floors are only a lower bound.
  #   jackson 2.22.4 (2026-10-17). CVE-2026-68497 needs >= 2.22.2 on 2.22.
  #   jackson 3.x is a new groupId (tools.jackson) and API, not a drop-in.
  jackson: 2.22.4
  #   httpcore5 + httpcore5-h2 5.4.4 (2026-09-20). CVE-2026-54399 and
  #   CVE-2026-54428 need >= 5.4.3. 5.5 is still beta.
  httpcore: 5.4.4
  #   httpclient5 5.6.5 (2026-10-06), built on httpcore 5.4.4.
  #   CVE-2026-64607 needs >= 5.6.3. 5.7 is still beta.
  httpclient: 5.6.5
  #   protobuf-java 4.36.2 (2026-09-17). CVE-2024-7254 needs >= 3.25.5 or
  #   >= 4.27.5. Only paimon-format uses it, for ORC, shaded under
  #   org.apache.paimon.shade. ORC's OrcProto is protoc 3.x code built on
  #   GeneratedMessageV3, which the 4.x runtime still carries: the Orc*Test
  #   run below is what proves the pair still works. Since 3.2x protobuf-java
  #   ships no pom.properties, so scanners cannot read this version inside
  #   the bundle; the check below reads it off the class.
  #
  #   guava 33.7.2-jre (2026-09-29). 30.1.1-jre has CVE-2020-8908,
  #   CVE-2023-2976 and CVE-2026-102554. Still Java 8 bytecode.
  guava: 33.7.2-jre
  #   netty 4.1.139.Final (2026-10-06), latest of 4.1, which is still patched.
  #   4.1.100.Final has 30+ advisories across codec-http, codec-http2,
  #   handler and common. 4.2 is a new minor with API changes: not needed.
  netty: 4.1.139.Final
  #
  # NO SCANNER SEES these shaded copies (no pom.properties in the bundle), so
  # a person must follow their advisories by hand: protobuf-java, guava and
  # netty (above), and paimon-shade's caffeine 2.9.3, left as is: it is the
  # last 2.x, has no advisory, and 3.x needs Java 11. A CycloneDX SBOM from
  # cyclonedx-maven-plugin was tested and left out: Trivy reads it, but it
  # lists every compile-scope dependency (110 the bundle does not hold, e.g.
  # hadoop-common 2.8.5, zookeeper 3.4.6), so the overlay gate would fail on
  # code that is not shipped.
  protobuf: 4.36.2
  # paimon.shade.version in Paimon's pom at the release tag.
  shade-version: 0.8.0
  shade-commit: b2cec3119bc64c1d98cfc02d3d00ce0c5bd4e9cc
  paimon-commit: ac223f47d916f4c8e9c07fd1745db448e4e7d0d8
  # Bump when the shade build changes with no version bump.
  shade-suffix: lago1
  # Latest release (3.6.2). Paimon itself already builds with 3.5.3.
  maven-shade-plugin: 3.6.2

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/paimon-shade.git
      tag: release-${{vars.shade-version}}
      expected-commit: ${{vars.shade-commit}}
      destination: paimon-shade

  - uses: git-checkout
    with:
      repository: https://github.com/apache/paimon.git
      tag: release-${{package.version}}
      expected-commit: ${{vars.paimon-commit}}
      destination: paimon

  - name: Build paimon-shade-jackson-2 on the pinned jackson
    working-directory: paimon-shade/paimon-shade-jackson-parent
    runs: |
      set -eu
      shade_jackson="${{vars.jackson}}-${{vars.shade-suffix}}"
      # The jackson parent hardcodes `<jackson>-<shade>` as its version and its
      # two children repeat it as their parent version. Rename all three, and
      # move the jackson.version property it feeds to its BOM import. The greps
      # fail the build if the release tag no longer looks like this.
      upstream="$(sed -n 's|^    <version>\(.*-${{vars.shade-version}}\)</version>$|\1|p' pom.xml)"
      test -n "$upstream"
      sed -i "s|<version>${upstream}</version>|<version>${shade_jackson}-${{vars.shade-version}}</version>|" \
        pom.xml paimon-shade-jackson-2/pom.xml paimon-shade-jackson-module-jsonSchema-2/pom.xml
      sed -i "s|<jackson.version>[^<]*</jackson.version>|<jackson.version>${{vars.jackson}}</jackson.version>|" pom.xml
      grep -q "<jackson.version>${{vars.jackson}}</jackson.version>" pom.xml
      test "$(grep -c "<version>${shade_jackson}-${{vars.shade-version}}</version>" \
        pom.xml paimon-shade-jackson-2/pom.xml paimon-shade-jackson-module-jsonSchema-2/pom.xml \
        | awk -F: '{s+=$2} END {print s}')" -eq 3

      # paimon-shade pins maven-shade-plugin 3.4.1, whose ASM cannot read the
      # Java 21 classes under META-INF/versions/21 that jackson-core ships
      # since 2.18. The root pom is read through the parent's relativePath and
      # is not installed, so this changes the build tool only.
      sed -i '/<artifactId>maven-shade-plugin<\/artifactId>/{n;s|<version>3\.4\.1</version>|<version>${{vars.maven-shade-plugin}}</version>|}' ../pom.xml
      grep -A1 '<artifactId>maven-shade-plugin</artifactId>' ../pom.xml \
        | grep -q '<version>${{vars.maven-shade-plugin}}</version>'

      mvn -B -ntp install -DskipTests \
        -Dmaven.repo.local="${PWD}/../../.m2"

  - name: Build paimon-shade-guava-30 and paimon-shade-netty-4 on the pinned versions
    working-directory: paimon-shade
    runs: |
      set -eu
      # Both modules take their version from a root property:
      # `${guava.version}-<shade>`. Set the property and add the -lago suffix to
      # the module version, then make the NOTICE list what is bundled. The
      # greps fail the build if the release tag no longer looks like this.
      for lib in guava netty; do
        case "$lib" in
          guava) mod=paimon-shade-guava-30; v="${{vars.guava}}" ;;
          netty) mod=paimon-shade-netty-4;  v="${{vars.netty}}" ;;
        esac
        old="$(sed -n "s|^ *<${lib}.version>\(.*\)</${lib}.version>$|\1|p" pom.xml)"
        test -n "$old"
        sed -i "s|<${lib}.version>${old}</${lib}.version>|<${lib}.version>${v}</${lib}.version>|" pom.xml
        sed -i "s|<version>\${${lib}.version}-${{vars.shade-version}}</version>|<version>\${${lib}.version}-${{vars.shade-suffix}}-${{vars.shade-version}}</version>|" "$mod/pom.xml"
        grep -q "<version>\${${lib}.version}-${{vars.shade-suffix}}-${{vars.shade-version}}</version>" "$mod/pom.xml"
        sed -i "s|:${old}\$|:${v}|" "$mod/src/main/resources/META-INF/NOTICE"
        if grep -q ":${old}$" "$mod/src/main/resources/META-INF/NOTICE"; then exit 1; fi
      done
      # NOTICE entries a version swap cannot know (failureaccess, new epoll
      # classifiers) come from the resolved dependencies.
      for mod in paimon-shade-guava-30 paimon-shade-netty-4; do
        mvn -B -ntp -q dependency:list -pl "$mod" -DincludeScope=runtime \
          -DoutputFile="${PWD}/deps-$mod.txt" -Dmaven.repo.local="${PWD}/../.m2"
      done
      fa="$(awk '$1 ~ /^com[.]google[.]guava:failureaccess:jar:/ {split($1, a, ":"); print a[4]}' deps-paimon-shade-guava-30.txt)"
      test -n "$fa"
      notice=paimon-shade-guava-30/src/main/resources/META-INF/NOTICE
      sed -i "s|^- com.google.guava:failureaccess:.*$|- com.google.guava:failureaccess:${fa}|" "$notice"
      grep -qxF -- "- com.google.guava:failureaccess:${fa}" "$notice"
      notice=paimon-shade-netty-4/src/main/resources/META-INF/NOTICE
      classifiers="$(awk '$1 ~ /^io[.]netty:netty-transport-native-epoll:jar:/ {split($1, a, ":"); print a[4]}' deps-paimon-shade-netty-4.txt)"
      test -n "$classifiers"
      for c in $classifiers; do
        line="- io.netty:netty-transport-native-epoll:${c}:${{vars.netty}}"
        if ! grep -qxF -- "$line" "$notice"; then
          last="$(grep -n '^- io.netty:netty-transport-native-epoll:' "$notice" | tail -1 | cut -d: -f1)"
          test -n "$last"
          sed -i "${last}a\\${line}" "$notice"
        fi
        grep -qxF -- "$line" "$notice"
      done

      # The root pom's maven-shade-plugin was moved to a current release by the
      # jackson step above.
      mvn -B -ntp install -DskipTests \
        -pl paimon-shade-guava-30,paimon-shade-netty-4 \
        -Dmaven.repo.local="${PWD}/../.m2"

  # packages/paimon-flink-1.20/, copied into the workspace root by
  # build-packages.yaml (--source-dir); the paths are relative to paimon/.
  - uses: patch
    with:
      patches: ../0001-debezium-temporal-strings.patch ../0002-cdc-table-options.patch ../0003-jackson-bom.patch ../0004-cdc-update-column-nullability.patch
    working-directory: paimon

  - name: Build the Flink 1.20 bundle and the action jar
    working-directory: paimon
    runs: |
      set -eu
      # -Dtest runs the unit tests that cover the patched classes and the
      # jackson/avro serialization paths, on the pinned versions. Surefire
      # only: `package` stops before failsafe's ITCases, which need Docker.
      # -Pflink1: the module list of paimon-flink-1.20 sits in a profile that is
      # active by default, and on JDK 11 the JDK-activated profiles turn
      # active-by-default ones off.
      mvn -B -ntp package -Pflink1 \
        -pl paimon-flink/paimon-flink-1.20,paimon-flink/paimon-flink-action -am \
        -Dmaven.repo.local="${PWD}/../.m2" \
        -Dpaimon.shade.jackson.version="${{vars.jackson}}-${{vars.shade-suffix}}" \
        -Dpaimon.shade.guava.version="${{vars.guava}}-${{vars.shade-suffix}}" \
        -Dpaimon.shade.netty.version="${{vars.netty}}-${{vars.shade-suffix}}" \
        -Dlago.jackson.version="${{vars.jackson}}" \
        -Dapache.hc.core.version="${{vars.httpcore}}" \
        -Dapache.hc.client.version="${{vars.httpclient}}" \
        -Dprotobuf-java.version="${{vars.protobuf}}" \
        -Dspotless.check.skip=true \
        -Drat.skip=true \
        -Dsurefire.failIfNoSpecifiedTests=false \
        -Dtest='*JsonSerde*Test,DataTypeJsonParserTest,RESTApiJsonTest,Avro*Test,Orc*Test,Json*Test,UpdatedDataFieldsProcessFunctionBaseTest,Debezium*Test,KafkaDebeziumJsonDeserializationSchemaTest'

  - name: Check the bundled versions and install the jars
    working-directory: paimon
    runs: |
      set -eu
      bundle=paimon-flink/paimon-flink-1.20/target/paimon-flink-1.20-${{package.version}}.jar
      v() { unzip -p "$bundle" "META-INF/maven/$1/pom.properties" | sed -n 's/^version=//p'; }
      test "$(v com.fasterxml.jackson.core/jackson-databind)" = "${{vars.jackson}}"
      test "$(v com.fasterxml.jackson.core/jackson-core)" = "${{vars.jackson}}"
      test "$(v org.apache.httpcomponents.core5/httpcore5)" = "${{vars.httpcore}}"
      test "$(v org.apache.httpcomponents.core5/httpcore5-h2)" = "${{vars.httpcore}}"
      test "$(v org.apache.httpcomponents.client5/httpclient5)" = "${{vars.httpclient}}"
      # protobuf-java ships no pom.properties since it moved to Bazel (3.2x),
      # so read the version off the relocated RuntimeVersion class instead.
      pb="$("$JAVA_HOME/bin/javap" -cp "$bundle" -constants \
          org.apache.paimon.shade.com.google.protobuf.RuntimeVersion \
        | sed -nE 's/.* (MAJOR|MINOR|PATCH) = ([0-9]+);/\2/p' | paste -sd. -)"
      test "$pb" = "${{vars.protobuf}}"
      # No guava version file survives shading (paimon-shade strips
      # META-INF/maven). The shade step set and checked guava.version; check
      # that guava jar was resolved, and that the bundle's guava classes are
      # byte-identical to the -lago shade jar's.
      test -f "../.m2/com/google/guava/guava/${{vars.guava}}/guava-${{vars.guava}}.jar"
      shade_guava="../.m2/org/apache/paimon/paimon-shade-guava-30/${{vars.guava}}-${{vars.shade-suffix}}-${{vars.shade-version}}/paimon-shade-guava-30-${{vars.guava}}-${{vars.shade-suffix}}-${{vars.shade-version}}.jar"
      cls=org/apache/paimon/shade/guava30/com/google/common/collect/ImmutableList.class
      unzip -p "$shade_guava" "$cls" > shade.class
      unzip -p "$bundle" "$cls" > bundle.class
      test -s shade.class && test -s bundle.class
      cmp -s shade.class bundle.class
      unzip -p "$bundle" META-INF/io.netty.versions.properties \
        | grep -qx 'netty-all.version=${{vars.netty}}'
      # The patched classes are in.
      unzip -l "$bundle" | grep -q 'org/apache/paimon/flink/sink/cdc/CdcSchema.class'
      unzip -p "$bundle" org/apache/paimon/flink/action/cdc/format/debezium/DebeziumJsonRecordParser.class \
        | grep -aq 'lago.source-type.'

      install -Dm644 "$bundle" \
        "${{targets.destdir}}/opt/flink/lib/paimon-flink-1.20-${{package.version}}.jar"
      install -Dm644 paimon-flink/paimon-flink-action/target/paimon-flink-action-${{package.version}}.jar \
        "${{targets.destdir}}/opt/flink/lib/paimon-flink-action-${{package.version}}.jar"

test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /opt/flink/lib/paimon-flink-1.20-${{package.version}}.jar
        test -f /opt/flink/lib/paimon-flink-action-${{package.version}}.jar
        unzip -p /opt/flink/lib/paimon-flink-1.20-${{package.version}}.jar \
          META-INF/maven/com.fasterxml.jackson.core/jackson-databind/pom.properties \
          | grep -qx 'version=${{vars.jackson}}'
