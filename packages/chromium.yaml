# Chromium for gotenberg-base, repackaged from Chrome for Testing.
#
# Wolfi's chromium is stuck at 149.0.7827.53-r0 on both arches while Trivy's
# advisories want >= 152.0.7977.75-r0, so gotenberg-base has failed its CVE gate
# every day since 2026-10-02. Wolfi's chromium recipe is not public (not in
# wolfi-dev/os or /community), so bumping it in place is not an option and
# building chromium from source would mean owning a ~20 GB tree and a multi-hour
# compile on every release.
#
# Chrome for Testing publishes `chrome-headless-shell` prebuilt for linux-arm64
# and linux64 — which is the exact target a from-source build would have aimed
# at, since gotenberg only ever drives headless. So this fetches and repackages
# rather than compiles. Verified end to end: the binary runs as nonroot in the
# hardened image, gotenberg reports `chromium: up`, and HTML->PDF renders
# correctly (CSS, UTF-8, CJK, RTL, landscape, custom margins).
#
# Named `chromium` at the upstream version on purpose: that is what maps this to
# Wolfi's advisory data in Trivy, which is the whole point. Keep it that way.
#
# Licensing: the bundle ships the Chromium BSD-3-Clause license. Its ABOUT file
# carries Google Chrome boilerplate pointing at chrome://terms, whose only
# commercial restriction is the AVC patent clause. The codec surface is
# unchanged by this swap — Wolfi's chromium 149 carries the same H.264/AAC
# machinery, as does Debian's build. See the PR for the full comparison.
#
# Switching to Debian's `chromium-shell` later is a change to this file alone:
# same package name, version and install paths, different fetch + unpack. The
# consumers (gotenberg-base.yaml, lago-gotenberg's Dockerfile) do not move.
package:
  name: chromium
  version: 156.0.8078.47
  epoch: 0
  description: Headless Chromium for gotenberg, repackaged from Chrome for Testing
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      # Shared-library deps are generated by melange's SCA from the ELF, which
      # covers all 27 of them. Only the non-discoverable ones are listed here:
      # TLS roots, and the fonts Skia needs to render text at all.
      - ca-certificates-bundle
      - font-liberation

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  # One fetch per arch: the CfT archive name and its top-level directory both
  # differ between linux64 and linux-arm64, so the sha256 is pinned per arch.
  # Bumping the version means re-pinning both, in the same commit.
  - runs: |
      set -eu
      case "$(uname -m)" in
        aarch64)
          cft_arch=linux-arm64
          sha256=955059fa7020d7be85eb503e21339fd4d718f51f5996d3b60633fbf908bda132
          ;;
        x86_64)
          cft_arch=linux64
          sha256=0d5acc62c3e213f8c87d3c298d66ffcf9a236d12ea4b9f85318bf85dbc279daa
          ;;
        *)
          echo "::error::unsupported arch $(uname -m)" >&2
          exit 1
          ;;
      esac

      archive="chrome-headless-shell-${cft_arch}.zip"
      curl -fsSL -o "$archive" \
        "https://storage.googleapis.com/chrome-for-testing-public/${{package.version}}/${cft_arch}/${archive}"
      echo "${sha256}  ${archive}" | sha256sum -c -
      unzip -q "$archive"

      # Chromium resolves its .pak/.dat/.so siblings relative to the binary, so
      # the bundle has to stay intact in one directory. /usr/lib/chromium with a
      # /usr/bin/chromium symlink mirrors Wolfi's own layout, which is what
      # gotenberg-base's CHROMIUM_BIN_PATH already points at — so consumers need
      # no change when this package replaces Wolfi's.
      mkdir -p "${{targets.destdir}}/usr/lib/chromium" "${{targets.destdir}}/usr/bin"
      cp -a "chrome-headless-shell-${cft_arch}/." "${{targets.destdir}}/usr/lib/chromium/"
      chmod 0755 "${{targets.destdir}}/usr/lib/chromium/chrome-headless-shell"
      ln -sf /usr/lib/chromium/chrome-headless-shell "${{targets.destdir}}/usr/bin/chromium"

  # No `strip`: the binary ships pre-stripped, and stripping it again risks
  # breaking the embedded resource offsets.
