name: Build apko base images

on:
  push:
    branches: [main]
    paths:
      - "apko/**"
      - ".github/workflows/build-bases.yaml"
      # The build steps live here: a change must rebuild every image too.
      - ".github/workflows/build-base.yaml"
  workflow_run:
    # build-packages.yaml publishes the apks the overlay consumers install. A
    # push that changes a recipe must not rebuild those images in parallel —
    # it would sync the apk the bucket held before the merge. Chaining on the
    # package run instead makes one merge produce one correct base tag.
    workflows: ["Build Wolfi packages"]
    types: [completed]
  schedule:
    # Daily, to pick up Wolfi upstream package updates (CVE patches, etc.).
    # Wolfi publishes multiple times a day; daily keeps `:latest` within a
    # 24h drift of upstream.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      image:
        description: 'apko yaml basename to build (e.g. `lago-api-base`). Empty = all.'
        required: false
        type: string
        default: ""

# This run only picks the images and starts one build-base.yaml run per
# image. A failing image is a red run of its own; this one stays green and
# lists every image run in its summary.
permissions:
  contents: read

defaults:
  run:
    shell: nu {0}

jobs:
  discover:
    # A failed package build publishes nothing, so there is no new apk to
    # rebuild anything from.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has-images: ${{ steps.set.outputs.has-images }}
    steps:
      - uses: actions/checkout@v4
        with:
          # push: need two commits to diff the range. schedule/dispatch: shallow is fine.
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}

      - uses: hustcer/setup-nu@v3.29
        with:
          version: "0.116.1"

      - name: Compute matrix
        id: set
        env:
          EVENT: ${{ github.event_name }}
          IMAGE: ${{ inputs.image }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Four triggers, four selection rules:
          #   push               — diff the push range and build only changed apko/*.yaml,
          #                        UNLESS build-bases.yaml itself changed (rebuild everything,
          #                        since a workflow-level fix should apply to every manifest).
          #   workflow_dispatch  — explicit `image` input wins; empty = all.
          #   workflow_run       — build-packages.yaml just published new apks, so rebuild
          #                        every manifest that opts into the overlay. They mark
          #                        themselves by naming ./repo-local, the same check the
          #                        build job runs.
          #   schedule           — daily CVE pickup, rebuild everything.
          let all = ls apko/*.yaml | get name | sort
          let files = match $env.EVENT {
            'workflow_dispatch' => {
              if ($env.IMAGE? | default '') == '' { $all } else {
                let file = $"apko/($env.IMAGE).yaml"
                if not ($file | path exists) {
                  print $"::error::($file) does not exist. Available:"
                  for f in $all { print $f }
                  exit 1
                }
                [$file]
              }
            }
            'push' => {
              # First-ever push to a new branch surfaces as all-zeroes; fall back
              # to a full rebuild rather than trying to diff against nothing.
              if $env.BEFORE =~ '^0+$' { $all } else {
                let changed = ^git diff --name-only $env.BEFORE $env.GITHUB_SHA -- apko .github/workflows/build-bases.yaml .github/workflows/build-base.yaml
                  | complete | get stdout | lines
                if ($changed | any {|f| $f =~ '^\.github/workflows/build-bases?\.yaml$' }) {
                  # Workflow-level change — rebuild all manifests so the fix lands uniformly.
                  $all
                } else {
                  $changed | where {|f| $f =~ '^apko/.+\.yaml$' }
                }
              }
            }
            'workflow_run' => { $all | where {|f| open --raw $f | str contains 'repo-local' } }
            _ => { $all }
          }

          let matrix = $files | each {|f| {file: $f, repo: ($f | path parse | get stem)} } | to json -r
          $"matrix=($matrix)\nhas-images=($files | is-not-empty)\n" | save -a $env.GITHUB_OUTPUT
          print $matrix

  dispatch:
    needs: discover
    if: needs.discover.outputs.has-images == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Start the image runs and download their change markers.
      actions: write
    outputs:
      changed: ${{ steps.summary.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MATRIX: ${{ needs.discover.outputs.matrix }}
      # build-base.yaml puts this in its run name: that is how this run finds
      # its image runs. The attempt keeps a re-run off the runs of the
      # attempt before it.
      PARENT: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: hustcer/setup-nu@v3.29
        with:
          version: "0.116.1"

      - name: Start one run per image
        run: |
          # A workflow_dispatch from GITHUB_TOKEN starts a run, unlike most
          # events. The image runs send no base-updated: this run sends one
          # for the batch. They build the commit `discover` read, not the tip
          # of the ref. A dispatch that fails 3 times is skipped, so the
          # images already started are still waited for and announced; the
          # last step fails this run for it.
          mut started = []
          mut failed = []
          for image in ($env.MATRIX | from json | get repo) {
            mut ok = false
            for try in 1..3 {
              let r = ^gh workflow run build-base.yaml --ref $env.GITHUB_REF_NAME -f $"image=($image)" -f $"parent=($env.PARENT)" -f notify=false -f $"sha=($env.GITHUB_SHA)" | complete
              if $r.exit_code == 0 { $ok = true; break }
              print -e ($r.stderr | str trim)
              sleep ($try * 10sec)
            }
            if $ok {
              $started = $started | append $image
              print $"started ($image)"
            } else {
              print $"::error title=($image)::could not start its run"
              $failed = $failed | append $image
            }
          }
          $started | to json | save -f started.json
          $failed | to json | save -f failed.json

      - name: Wait for the image runs
        # Ends on its own at the deadline, before timeout-minutes, so the
        # summary below still sees the last poll. A failed poll is retried.
        # build-base.yaml reads this step's status: an image run that ends
        # after it announces itself.
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          let want = open started.json | length
          let deadline = (date now) + 110min
          [] | to json | save -f runs.json
          loop {
            let list = ^gh run list --workflow build-base.yaml --event workflow_dispatch --limit 200 --json databaseId,displayTitle,status,conclusion,url | complete
            if $list.exit_code == 0 {
              let runs = $list.stdout | from json | where {|r| $r.displayTitle | str ends-with $" \(batch ($env.PARENT)\)" }
              $runs | to json | save -f runs.json
              let open = $runs | where status != 'completed' | length
              print $"($runs | length)/($want) started, ($open) not finished"
              if ($runs | length) >= $want and $open == 0 { break }
            } else {
              print "::warning::gh run list failed, retrying"
            }
            if (date now) > $deadline {
              print "::warning::image runs not finished after 110 minutes; summarizing what finished"
              break
            }
            sleep 30sec
          }

      - name: Summarize and collect the change markers
        id: summary
        # Also after a failed wait: published images must still be announced.
        if: ${{ !cancelled() }}
        run: |
          # A failed image does not fail this run: its own run is red.
          let runs = if ('runs.json' | path exists) { open runs.json } else { [] }
          mut rows = ['| Image | Result | Published |' '| --- | --- | --- |']
          mut changed = false
          for run in ($runs | sort-by displayTitle) {
            let result = if ($run.conclusion | default '') == '' { 'not finished' } else { $run.conclusion }
            let image = $run.displayTitle | str replace -r ' \(batch .*$' ''
            mut published = 'no'
            if $result == 'success' and (^gh run download ($run.databaseId | into string) -n $"changed-($image)" -D $"changed/($image)" | complete).exit_code == 0 {
              $published = 'yes'
              $changed = true
            }
            if $result != 'success' { print $"::warning title=($image)::($result): ($run.url)" }
            $rows = $rows | append $"| `($image)` | [($result)]\(($run.url)\) | ($published) |"
          }
          ($rows | str join "\n") + "\n" | save -a $env.GITHUB_STEP_SUMMARY
          $"changed=($changed)\n" | save -a $env.GITHUB_OUTPUT

      - name: Fail on images that never started
        if: ${{ !cancelled() }}
        run: |
          let failed = if ('failed.json' | path exists) { open failed.json } else { [] }
          if ($failed | is-not-empty) {
            print $"::error::no run started for: ($failed | str join ' ')"
            exit 1
          }

  notify:
    # Tells the consumers a base moved; their `base-refresh plan` reads the
    # new digests itself. One notice per batch, also when an image failed: the
    # others published.
    needs: dispatch
    if: ${{ !cancelled() && needs.dispatch.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repository: [getlago/lago-deploy, getlago/lago-infrastructure]
    env:
      # Without it the consumers catch up on their daily run.
      HAS_TOKEN: ${{ secrets.BASE_UPDATE_DISPATCH_TOKEN != '' }}
    steps:
      # Cross-repo `contents: write`; GITHUB_TOKEN cannot do it.
      - name: Dispatch base-updated
        if: env.HAS_TOKEN == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.BASE_UPDATE_DISPATCH_TOKEN }}
          repository: ${{ matrix.repository }}
          event-type: base-updated
          client-payload: '{"run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
