name: Build apko base images

on:
  push:
    branches: [main]
    paths:
      - "apko/**"
      - ".github/workflows/build-bases.yaml"
  workflow_run:
    # build-packages.yaml publishes the apks the overlay consumers install. A
    # push that changes a recipe must not rebuild those images in parallel —
    # it would sync the apk the bucket held before the merge. Chaining on the
    # package run instead makes one merge produce one correct base tag.
    workflows: ["Build Wolfi packages"]
    types: [completed]
  schedule:
    # Daily, to pick up Wolfi upstream package updates (CVE patches, etc.).
    # Wolfi publishes multiple times a day; daily keeps `:latest` within a
    # 24h drift of upstream.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      image:
        description: 'apko yaml basename to build (e.g. `lago-api-base`). Empty = all.'
        required: false
        type: string
        default: ""

# This run only picks the images and starts one build-base.yaml run per
# image. A failing image is a red run of its own; this one stays green and
# lists every image run in its summary.
permissions:
  contents: read

jobs:
  discover:
    # A failed package build publishes nothing, so there is no new apk to
    # rebuild anything from.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has-images: ${{ steps.set.outputs.has-images }}
    steps:
      - uses: actions/checkout@v4
        with:
          # push: need two commits to diff the range. schedule/dispatch: shallow is fine.
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}

      - name: Compute matrix
        id: set
        run: |
          set -euo pipefail
          # Four triggers, four selection rules:
          #   push               — diff the push range and build only changed apko/*.yaml,
          #                        UNLESS build-bases.yaml itself changed (rebuild everything,
          #                        since a workflow-level fix should apply to every manifest).
          #   workflow_dispatch  — explicit `image` input wins; empty = all.
          #   workflow_run       — build-packages.yaml just published new apks, so rebuild
          #                        every manifest that opts into the overlay. They mark
          #                        themselves by naming ./repo-local, the same grep the
          #                        build job runs below.
          #   schedule           — daily CVE pickup, rebuild everything.
          case "${{ github.event_name }}" in
            workflow_dispatch)
              if [ -n "${{ inputs.image }}" ]; then
                files="apko/${{ inputs.image }}.yaml"
                if [ ! -f "$files" ]; then
                  echo "::error::apko/${{ inputs.image }}.yaml does not exist. Available:"
                  ls apko/*.yaml
                  exit 1
                fi
              else
                files=$(ls apko/*.yaml)
              fi
              ;;
            push)
              BEFORE="${{ github.event.before }}"
              # First-ever push to a new branch surfaces as all-zeroes; fall back
              # to a full rebuild rather than trying to diff against nothing.
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                files=$(ls apko/*.yaml)
              else
                CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- apko .github/workflows/build-bases.yaml 2>/dev/null || true)
                if echo "$CHANGED" | grep -qx '\.github/workflows/build-bases\.yaml'; then
                  # Workflow-level change — rebuild all manifests so the fix lands uniformly.
                  files=$(ls apko/*.yaml)
                else
                  files=$(echo "$CHANGED" | grep -E '^apko/.+\.yaml$' || true)
                fi
              fi
              ;;
            workflow_run)
              files=$(grep -l 'repo-local' apko/*.yaml || true)
              ;;
            schedule|*)
              files=$(ls apko/*.yaml)
              ;;
          esac

          matrix="["
          for f in $files; do
            [ -n "$f" ] || continue
            name=$(basename "$f" .yaml)
            matrix+="{\"file\":\"$f\",\"repo\":\"$name\"},"
          done
          matrix="${matrix%,}]"
          has_images="false"
          [ "$matrix" != "[]" ] && has_images="true"
          {
            echo "matrix=$matrix"
            echo "has-images=$has_images"
          } >> $GITHUB_OUTPUT
          echo "$matrix"

  dispatch:
    needs: discover
    if: needs.discover.outputs.has-images == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Start the image runs and download their change markers.
      actions: write
    outputs:
      changed: ${{ steps.wait.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MATRIX: ${{ needs.discover.outputs.matrix }}
      # build-base.yaml puts this in its run name: that is how this run finds
      # its image runs.
      BATCH: (batch ${{ github.run_id }})
    steps:
      - name: Start one run per image
        run: |
          set -euo pipefail
          # A workflow_dispatch from GITHUB_TOKEN starts a run, unlike most
          # events. The image runs send no base-updated: this run sends one
          # for the batch.
          jq -r '.[].repo' <<<"$MATRIX" | while read -r image; do
            gh workflow run build-base.yaml --ref "$GITHUB_REF_NAME" \
              -f image="$image" -f parent="$GITHUB_RUN_ID" -f notify=false
            echo "started $image"
          done

      - name: Wait for the image runs
        id: wait
        timeout-minutes: 120
        run: |
          set -euo pipefail
          want=$(jq length <<<"$MATRIX")
          while :; do
            runs=$(gh run list --workflow build-base.yaml --event workflow_dispatch --limit 200 \
              --json databaseId,displayTitle,status,conclusion,url |
              jq --arg b "$BATCH" '[.[] | select(.displayTitle | endswith($b))]')
            got=$(jq length <<<"$runs")
            open=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            echo "$got/$want started, $open not finished"
            [[ $got -ge $want && $open == 0 ]] && break
            sleep 30
          done

          # A failed image does not fail this run: its own run is red.
          {
            echo "| Image | Result | Published |"
            echo "| --- | --- | --- |"
          } >>"$GITHUB_STEP_SUMMARY"
          changed=false
          while read -r run; do
            id=$(jq -r .databaseId <<<"$run") url=$(jq -r .url <<<"$run")
            conclusion=$(jq -r .conclusion <<<"$run")
            image=$(jq -r '.displayTitle | sub(" \\(batch .*$"; "")' <<<"$run")
            published=no
            if [[ $conclusion == success ]] && gh run download "$id" -n "changed-$image" -D "changed/$image" 2>/dev/null; then
              published=yes changed=true
            fi
            [[ $conclusion == success ]] || echo "::warning title=$image::$conclusion: $url"
            echo "| \`$image\` | [$conclusion]($url) | $published |" >>"$GITHUB_STEP_SUMMARY"
          done < <(jq -c 'sort_by(.displayTitle) | .[]' <<<"$runs")
          echo "changed=$changed" >>"$GITHUB_OUTPUT"

  notify:
    # Tells the consumers a base moved; their `base-refresh plan` reads the
    # new digests itself. One notice per batch, also when an image failed: the
    # others published.
    needs: dispatch
    if: needs.dispatch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repository: [getlago/lago-deploy, getlago/lago-infrastructure]
    env:
      # Without it the consumers catch up on their daily run.
      HAS_TOKEN: ${{ secrets.BASE_UPDATE_DISPATCH_TOKEN != '' }}
    steps:
      # Cross-repo `contents: write`; GITHUB_TOKEN cannot do it.
      - name: Dispatch base-updated
        if: env.HAS_TOKEN == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.BASE_UPDATE_DISPATCH_TOKEN }}
          repository: ${{ matrix.repository }}
          event-type: base-updated
          client-payload: '{"run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
