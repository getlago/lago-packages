name: Build apko base images

on:
  push:
    branches: [main]
    paths:
      - "apko/**"
      - ".github/workflows/build-bases.yaml"
  schedule:
    # Daily, to pick up Wolfi upstream package updates (CVE patches, etc.).
    # Wolfi publishes multiple times a day; daily keeps `:latest` within a
    # 24h drift of upstream.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      image:
        description: 'apko yaml basename to build (e.g. `lago-api-base`). Empty = all.'
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/getlago

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has-images: ${{ steps.set.outputs.has-images }}
    steps:
      - uses: actions/checkout@v4
        with:
          # push: need two commits to diff the range. schedule/dispatch: shallow is fine.
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}

      - name: Compute matrix
        id: set
        run: |
          set -euo pipefail
          # Three triggers, three selection rules:
          #   push               — diff the push range and build only changed apko/*.yaml,
          #                        UNLESS build-bases.yaml itself changed (rebuild everything,
          #                        since a workflow-level fix should apply to every manifest).
          #   workflow_dispatch  — explicit `image` input wins; empty = all.
          #   schedule           — daily CVE pickup, rebuild everything.
          case "${{ github.event_name }}" in
            workflow_dispatch)
              if [ -n "${{ inputs.image }}" ]; then
                files="apko/${{ inputs.image }}.yaml"
                if [ ! -f "$files" ]; then
                  echo "::error::apko/${{ inputs.image }}.yaml does not exist. Available:"
                  ls apko/*.yaml
                  exit 1
                fi
              else
                files=$(ls apko/*.yaml)
              fi
              ;;
            push)
              BEFORE="${{ github.event.before }}"
              # First-ever push to a new branch surfaces as all-zeroes; fall back
              # to a full rebuild rather than trying to diff against nothing.
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                files=$(ls apko/*.yaml)
              else
                CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- apko .github/workflows/build-bases.yaml 2>/dev/null || true)
                if echo "$CHANGED" | grep -qx '\.github/workflows/build-bases\.yaml'; then
                  # Workflow-level change — rebuild all manifests so the fix lands uniformly.
                  files=$(ls apko/*.yaml)
                else
                  files=$(echo "$CHANGED" | grep -E '^apko/.+\.yaml$' || true)
                fi
              fi
              ;;
            schedule|*)
              files=$(ls apko/*.yaml)
              ;;
          esac

          matrix="["
          for f in $files; do
            [ -n "$f" ] || continue
            name=$(basename "$f" .yaml)
            matrix+="{\"file\":\"$f\",\"repo\":\"$name\"},"
          done
          matrix="${matrix%,}]"
          has_images="false"
          [ "$matrix" != "[]" ] && has_images="true"
          {
            echo "matrix=$matrix"
            echo "has-images=$has_images"
          } >> $GITHUB_OUTPUT
          echo "$matrix"

  build:
    needs: discover
    if: needs.discover.outputs.has-images == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install apko
        # Pin the release AND its sha256 — chainguard-dev/actions doesn't
        # publish a setup-apko action (only setup-melange), so the manual
        # download stays. Rotate APKO_SHA256 whenever APKO_VERSION bumps;
        # the checksum is authoritative for chainguard-dev/apko releases
        # (see the cosign-signed `checksums.txt` in the same release).
        env:
          APKO_VERSION: v1.4.1
          APKO_SHA256: d72352a2a875440946c05877a2e20eb4ffe6ab785cea8e5dbea942f1d62fd42e
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          asset=apko_${APKO_VERSION#v}_linux_amd64.tar.gz
          curl -sSfL -o "$workdir/$asset" \
            "https://github.com/chainguard-dev/apko/releases/download/${APKO_VERSION}/${asset}"
          echo "${APKO_SHA256}  $workdir/$asset" | sha256sum -c -
          tar xz -C "$workdir" -f "$workdir/$asset"
          bin=$(find "$workdir" -type f -name apko -perm -u+x | head -1)
          if [ -z "$bin" ]; then
            echo "::error::apko binary not found in tarball; contents:"
            find "$workdir" -maxdepth 3
            exit 1
          fi
          sudo mv "$bin" /usr/local/bin/apko
          apko version

      - name: Does this manifest use the Lago overlay?
        # Manifests opt in by referencing ./repo-local. Everything else skips the
        # role assumption and the download entirely, so the other images pay
        # nothing for this.
        id: overlay
        run: |
          set -euo pipefail
          if grep -q 'repo-local' "${{ matrix.file }}"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assume the packages reader role
        if: steps.overlay.outputs.needed == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Published as a repo variable by the packages Pulumi project
          # (getlago/lago-infrastructure, pulumi/projects/packages).
          role-to-assume: ${{ vars.PACKAGES_READER_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync the Lago overlay
        if: steps.overlay.outputs.needed == 'true'
        run: |
          set -euo pipefail
          # apk resolves <repo>/<arch>/APKINDEX.tar.gz, which is the layout the
          # bucket already has. Only the packages this repo consumes are pulled.
          aws s3 sync "s3://lago-wolfi-packages/os/" ./repo-local/ \
            --exclude "*" \
            --include "*/APKINDEX.tar.gz" \
            --include "lago-signing.rsa.pub" \
            --include "*/chromium-*.apk"
          # Fail loudly rather than silently falling back to Wolfi's older
          # package, which would reintroduce the CVEs this overlay exists to fix.
          test -f ./repo-local/lago-signing.rsa.pub
          for arch in x86_64 aarch64; do
            test -f "./repo-local/$arch/APKINDEX.tar.gz"
          done
          du -sh ./repo-local

      - name: Build apko base (${{ matrix.repo }}) — one OCI tarball per arch
        # One tarball per arch, not a single `--arch x86_64,aarch64` build:
        # that emits a multi-image archive, and Trivy's tarball reader
        # rejects it ("tarball must contain only a single image"). Building
        # per arch keeps the scan gate on the exact bytes that get pushed —
        # the multi-arch index is assembled from these two below.
        run: |
          for arch in x86_64 aarch64; do
            apko build \
              --arch "$arch" \
              ${{ matrix.file }} \
              ${{ env.REGISTRY }}/${{ matrix.repo }}:${{ github.sha }} \
              "image-$arch.tar"
          done

      - name: Stage per-manifest .trivyignore
        # Every manifest can carry its own `.trivyignore.d/<name>` file for
        # CVEs that Trivy flags as fixable but Wolfi hasn't packaged the fix
        # for yet (typical of fast-moving trees like chromium). Trivy's
        # `trivyignores` input requires the path to exist, so we `touch` an
        # empty file for manifests that don't ship one — that keeps the
        # opt-in surface small and the workflow uniform. Stale entries in
        # any file are harmless (Trivy silently ignores non-matching IDs)
        # and should be pruned on the next clean daily rebuild.
        run: |
          mkdir -p .trivyignore.d
          touch ".trivyignore.d/${{ matrix.repo }}"

      - name: Scan x86_64 tarball for HIGH/CRITICAL CVEs (Trivy)
        # Scans the local OCI archive directly, before it ever reaches
        # GHCR. `ignore-unfixed: true` skips CVEs with no upstream fix so
        # builds only break on things we can actually do something about
        # — bumping a Wolfi package or waiting for upstream to ship a
        # patch.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: image-x86_64.tar
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'
          trivyignores: .trivyignore.d/${{ matrix.repo }}

      - name: Scan aarch64 tarball for HIGH/CRITICAL CVEs (Trivy)
        # Both arches are gated: Wolfi ships arch-specific builds, so a CVE
        # can be fixed on one and not the other. The vulnerability DB is
        # cached by the previous step, so this pass is cheap.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: image-aarch64.tar
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'
          trivyignores: .trivyignore.d/${{ matrix.repo }}

      - name: Login to GHCR
        # GITHUB_TOKEN + `packages: write` is the only credential needed.
        # Writes ~/.docker/config.json, which crane and buildx both read.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        # The vendored setup-crane action handles binary integrity itself
        # (pinned version + published checksum verification inside the
        # action), so we drop the manual curl and rely on it the same way
        # we rely on chainguard-dev/actions/setup-melange elsewhere.
        uses: imjasonh/setup-crane@v0.7
        with:
          version: v0.20.2

      - name: Push scan-clean per-arch images to GHCR
        # crane pushes the exact tarballs Trivy scanned — no rebuild, no
        # drift between the scan and what lands in the registry. The
        # per-arch tags are kept: they cost nothing and make it possible to
        # pull one arch directly when debugging.
        run: |
          for arch in x86_64 aarch64; do
            crane push "image-$arch.tar" \
              ${{ env.REGISTRY }}/${{ matrix.repo }}:${{ github.sha }}-$arch
          done

      - name: Assemble multi-arch index (:sha and :latest)
        # Builds the manifest list from the two scanned per-arch images, so
        # both tags resolve to bytes that passed the gate.
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ matrix.repo }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ matrix.repo }}:latest \
            ${{ env.REGISTRY }}/${{ matrix.repo }}:${{ github.sha }}-x86_64 \
            ${{ env.REGISTRY }}/${{ matrix.repo }}:${{ github.sha }}-aarch64

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign base image (keyless via GH OIDC)
        # Signs both the SHA-pinned tag and :latest so pulls can verify
        # against the same key material regardless of which tag they used.
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign ${{ env.REGISTRY }}/${{ matrix.repo }}:${{ github.sha }}
          cosign sign ${{ env.REGISTRY }}/${{ matrix.repo }}:latest
