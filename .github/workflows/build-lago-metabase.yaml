name: Build lago-metabase image

# Wraps upstream metabase's released JAR onto the hardened
# lago-metabase-base image. Same Trivy → cosign gate as the apko bases.
#
# Triggers:
#   - Push to main touching dockerfiles/lago-metabase/** (Dockerfile or
#     METABASE_VERSION bump).
#   - Daily rebuild, so the base's picked-up Wolfi CVE fixes flow into
#     the final image within ~24h without a manual push.
#   - Manual dispatch with an optional version override for hot-fix
#     rebuilds without editing METABASE_VERSION.
#
# Base auto-build note: the lago-metabase-base apko manifest is built
# by build-bases.yaml (path filter on apko/**). That workflow pushes
# `ghcr.io/getlago/lago-metabase-base:latest`, which this Dockerfile
# consumes as its RUNTIME_IMAGE. Merging a change to the apko manifest
# alone does NOT trigger this workflow — merge the base first, wait for
# `:latest` to publish, then merge (or workflow_dispatch) the wrapper.

on:
  push:
    branches: [main]
    paths:
      - "dockerfiles/lago-metabase/**"
      - ".github/workflows/build-lago-metabase.yaml"
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      metabase-version:
        description: "Upstream metabase release tag (e.g. v0.63.15). Empty = read from dockerfiles/lago-metabase/METABASE_VERSION."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/getlago
  IMAGE: lago-metabase

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.push.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve metabase version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.metabase-version }}" ]; then
            version="${{ inputs.metabase-version }}"
          else
            version=$(tr -d '[:space:]' < dockerfiles/lago-metabase/METABASE_VERSION)
          fi
          if [ -z "$version" ]; then
            echo "::error::metabase version not set (empty input and empty METABASE_VERSION file)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building metabase version: $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch image (load one arch for Trivy)
        # Two builds: an amd64-only load into the local docker daemon so
        # Trivy can scan the exact bytes, and a multi-arch push to GHCR
        # right after. buildx caches the deps between the two runs, so
        # the second pass is fast; and we still gate on the scan before
        # anything reaches the registry.
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg METABASE_VERSION=${{ steps.version.outputs.version }} \
            --tag local/${{ env.IMAGE }}:scan \
            --load \
            dockerfiles/lago-metabase

      - name: Scan image for HIGH/CRITICAL CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ env.IMAGE }}:scan
          format: table
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: Build + push multi-arch image
        id: push
        # Multi-arch push after the scan. Reuses the buildx cache from
        # the previous build so it's not a full rebuild — just the arm64
        # slice + the multi-arch index push.
        run: |
          set -euo pipefail
          image_sha=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ github.sha }}
          image_ver=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          image_latest=${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg METABASE_VERSION=${{ steps.version.outputs.version }} \
            --tag "$image_sha" \
            --tag "$image_ver" \
            --tag "$image_latest" \
            --push \
            dockerfiles/lago-metabase
          echo "image-ref=$image_sha" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image (keyless via GH OIDC)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          version=${{ steps.version.outputs.version }}
          for tag in "${version}-${{ github.sha }}" "${version}" latest; do
            cosign sign ${{ env.REGISTRY }}/${{ env.IMAGE }}:${tag}
          done
