name: Build lago-metabase image

# Wraps upstream metabase's released JAR onto the hardened
# lago-metabase-base image. Same Trivy → cosign gate as the apko bases.
#
# Triggers:
#   - Push to main touching dockerfiles/lago-metabase/** (Dockerfile or
#     METABASE_VERSION bump).
#   - Daily rebuild, so the base's picked-up Wolfi CVE fixes flow into
#     the final image within ~24h without a manual push.
#   - Manual dispatch with an optional version override for hot-fix
#     rebuilds without editing METABASE_VERSION.
#
# Base auto-build note: the lago-metabase-base apko manifest is built
# by build-bases.yaml (path filter on apko/**). That workflow pushes
# `ghcr.io/getlago/lago-metabase-base:latest`, which this Dockerfile
# consumes as its RUNTIME_IMAGE. Merging a change to the apko manifest
# alone does NOT trigger this workflow — merge the base first, wait for
# `:latest` to publish, then merge (or workflow_dispatch) the wrapper.

on:
  push:
    branches: [main]
    paths:
      - "dockerfiles/lago-metabase/**"
      - ".github/workflows/build-lago-metabase.yaml"
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      metabase-version:
        description: "Upstream metabase release tag (e.g. v0.63.15). Empty = read from dockerfiles/lago-metabase/METABASE_VERSION."
        required: false
        type: string
        default: ""
      metabase-sha256:
        description: "Expected sha256 of the metabase.jar for that version. REQUIRED when metabase-version is set. Empty = read from dockerfiles/lago-metabase/METABASE_SHA256."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/getlago
  IMAGE: lago-metabase

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.push.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve metabase version and sha256
        id: version
        # Both must resolve to non-empty values. An empty sha256 would let a
        # tampered JAR silently ship — CLAUDE.md at the repo root spells out
        # the no-unverified-downloads rule this gate enforces.
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.metabase-version }}" ]; then
            version="${{ inputs.metabase-version }}"
          else
            version=$(tr -d '[:space:]' < dockerfiles/lago-metabase/METABASE_VERSION)
          fi
          if [ -n "${{ inputs.metabase-sha256 }}" ]; then
            sha256="${{ inputs.metabase-sha256 }}"
          else
            sha256=$(tr -d '[:space:]' < dockerfiles/lago-metabase/METABASE_SHA256)
          fi
          if [ -z "$version" ]; then
            echo "::error::metabase version not set (empty input and empty METABASE_VERSION file)"
            exit 1
          fi
          if [ -z "$sha256" ]; then
            echo "::error::metabase sha256 not set (empty input and empty METABASE_SHA256 file). See CLAUDE.md."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Building metabase version: $version"
          echo "Expected sha256:            $sha256"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch image (load one arch for Trivy)
        # Two builds: an amd64-only load into the local docker daemon so
        # Trivy can scan the exact bytes, and a multi-arch push to GHCR
        # right after. buildx caches the deps between the two runs, so
        # the second pass is fast; and we still gate on the scan before
        # anything reaches the registry.
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg METABASE_VERSION=${{ steps.version.outputs.version }} \
            --build-arg METABASE_SHA256=${{ steps.version.outputs.sha256 }} \
            --tag local/${{ env.IMAGE }}:scan \
            --load \
            dockerfiles/lago-metabase

      - name: Smoke test (boot the image under the deployed security profile)
        # The scan proves the bytes are clean; it never proves they run. This
        # image shipped a `CMD ["java", ...]` against a base whose PATH did not
        # include the JVM bin directory, so every build passed Trivy and cosign
        # while the container died at init with exit 127. Boot it here instead.
        #
        # Runs with the same flags the pod uses - non-root, read-only rootfs,
        # all capabilities dropped - so a regression in either the PATH or the
        # MB_PLUGINS_DIR handling fails the build rather than the rollout.
        run: |
          set -euo pipefail
          docker network create mb-smoke
          docker run -d --name mb-smoke-db --network mb-smoke \
            -e POSTGRES_USER=mb -e POSTGRES_PASSWORD=mb -e POSTGRES_DB=mb \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec mb-smoke-db pg_isready -U mb >/dev/null 2>&1 && break
            sleep 2
          done

          # Fails with exit 127 if `java` is not resolvable on PATH.
          docker run --rm --entrypoint /bin/bash local/${{ env.IMAGE }}:scan \
            -c 'command -v java && java -version'

          docker run -d --name mb-smoke-app --network mb-smoke \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            -e MB_DB_TYPE=postgres -e MB_DB_HOST=mb-smoke-db -e MB_DB_PORT=5432 \
            -e MB_DB_DBNAME=mb -e MB_DB_USER=mb -e MB_DB_PASS=mb \
            local/${{ env.IMAGE }}:scan

          ok=""
          for i in $(seq 1 60); do
            if docker logs mb-smoke-app 2>&1 | grep -q 'Metabase Initialization COMPLETE'; then
              ok=1; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' mb-smoke-app)" != "true" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$ok" ]; then
            echo "::error::metabase did not reach 'Initialization COMPLETE' under the deployed security profile"
            docker logs mb-smoke-app 2>&1 | tail -40
            exit 1
          fi

          code=$(docker run --rm --network mb-smoke curlimages/curl:latest \
            -s -o /dev/null -w '%{http_code}' http://mb-smoke-app:3000/api/health)
          test "$code" = "200" || {
            echo "::error::/api/health returned $code, expected 200"
            docker logs mb-smoke-app 2>&1 | tail -40
            exit 1
          }
          echo "smoke test passed: Initialization COMPLETE, /api/health 200"

      - name: Tear down smoke test
        if: always()
        run: |
          docker rm -f mb-smoke-app mb-smoke-db >/dev/null 2>&1 || true
          docker network rm mb-smoke >/dev/null 2>&1 || true

      - name: Stage .trivyignore
        # Mirrors build-bases.yaml. The JAR carries library CVEs that only
        # an upstream Metabase release can fix, so this image needs the same
        # opt-in ignore file the apko manifests get. `touch` keeps the step
        # working if the file is ever deleted — Trivy's `trivyignores` input
        # requires the path to exist.
        run: |
          mkdir -p .trivyignore.d
          touch ".trivyignore.d/${{ env.IMAGE }}"

      - name: Scan image for HIGH/CRITICAL CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ env.IMAGE }}:scan
          format: table
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          vuln-type: "os,library"
          trivyignores: .trivyignore.d/${{ env.IMAGE }}

      - name: Build + push multi-arch image
        id: push
        # Multi-arch push after the scan. Reuses the buildx cache from
        # the previous build so it's not a full rebuild — just the arm64
        # slice + the multi-arch index push.
        run: |
          set -euo pipefail
          image_sha=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ github.sha }}
          image_ver=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          image_latest=${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg METABASE_VERSION=${{ steps.version.outputs.version }} \
            --build-arg METABASE_SHA256=${{ steps.version.outputs.sha256 }} \
            --tag "$image_sha" \
            --tag "$image_ver" \
            --tag "$image_latest" \
            --push \
            dockerfiles/lago-metabase
          echo "image-ref=$image_sha" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image (keyless via GH OIDC)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          version=${{ steps.version.outputs.version }}
          for tag in "${version}-${{ github.sha }}" "${version}" latest; do
            cosign sign ${{ env.REGISTRY }}/${{ env.IMAGE }}:${tag}
          done
