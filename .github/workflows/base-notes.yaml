name: Base notes

# Comments on a PR that moves lago-packages bases (Renovate's "lago-packages
# bases" PRs) with what changed between the old and new base: the apk package
# diff and the OS CVEs it fixes (describe.nu, as in the base-refresh PRs).
# Renovate has no release notes to show for a base tag, and it rewrites the
# PR body on every rebase, so the notes go in one comment, updated in place.
on:
  workflow_call:
    inputs:
      pr:
        description: Number of the PR to describe, in the calling repository.
        type: number
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

defaults:
  run:
    shell: nu {0}

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Renovate pushes and labels in quick succession: only the newest run writes.
    concurrency:
      group: base-notes-${{ github.repository }}-${{ inputs.pr }}
      cancel-in-progress: true
    steps:
      - uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          version: "0.116.1"
      # the commit this workflow runs from, so a caller that pins it by SHA
      # also pins the scripts.
      - id: sha
        run: |
          let url = $"($env.ACTIONS_ID_TOKEN_REQUEST_URL)&audience=lago-packages-base-notes"
          let token = http get --raw -H {Authorization: $"bearer ($env.ACTIONS_ID_TOKEN_REQUEST_TOKEN)"} $url | from json
          let claims = $token.value | split row '.' | get 1 | decode base64 --url --nopad | decode | from json
          let ref = $claims.job_workflow_ref
          let sha = $claims.job_workflow_sha
          if not (($ref | str starts-with 'getlago/lago-packages/.github/workflows/base-notes.yaml@') and $sha =~ '^[0-9a-f]{40}$') {
            print $"::error::unexpected job_workflow_ref ($ref)"
            exit 1
          }
          $"sha=($sha)\n" | save -a $env.GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          repository: getlago/lago-packages
          ref: ${{ steps.sha.outputs.sha }}
          sparse-checkout: |
            .github/actions/base-notes
            .github/actions/base-refresh
      - run: |
          [base-notes base-refresh] | each {|d| $"($env.GITHUB_WORKSPACE)/.github/actions/($d)\n" } | str join | save -a $env.GITHUB_PATH
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.20.2
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: ^notes.nu
