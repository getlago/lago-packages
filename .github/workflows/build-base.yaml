name: Build apko base image
# One run per base image, so a failing image is a red run of its own and
# the other images stay green. Started by build-bases.yaml (one dispatch per
# image), or by hand to rebuild one image.
run-name: ${{ inputs.image }}${{ inputs.parent != '' && format(' (batch {0})', inputs.parent) || '' }}

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'apko yaml basename to build (e.g. `lago-api-base`).'
        required: true
        type: string
      parent:
        description: '<run id>.<attempt> of the build-bases.yaml batch that started this run. Empty when started by hand.'
        required: false
        type: string
        default: ""
      notify:
        description: 'Send base-updated to the consumers when the image changes. The batch sends one for all its images.'
        required: false
        type: boolean
        default: true
      sha:
        description: 'Commit to build. The batch passes the commit it evaluated. Empty = the tip of the ref.'
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

# Two runs can want the same image: a recipe push rebuilds its consumers
# through workflow_run, and an apko change in the same merge rebuilds them
# through push. Both end with `crane push` to one repo, so without this the
# last writer wins and that may be the older one. The later run is always
# the better one: it sees the apk the package build just published.
concurrency:
  group: base-${{ inputs.image }}
  cancel-in-progress: true

defaults:
  run:
    shell: nu {0}

env:
  REGISTRY: ghcr.io/getlago
  AWS_REGION: us-east-1
  PACKAGES_BUCKET: lago-wolfi-packages
  IMAGE_NAME: ${{ inputs.image }}
  FILE: apko/${{ inputs.image }}.yaml
  SRC_SHA: ${{ inputs.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_SHA }}
          fetch-depth: 0

      - uses: hustcer/setup-nu@v3.29
        with:
          version: "0.116.1"

      # The publish is signed as this workflow on the dispatched ref, so only
      # build commits that ref already holds.
      - name: Check the commit is on the ref
        run: |
          if (^git merge-base --is-ancestor $env.SRC_SHA $env.GITHUB_SHA | complete).exit_code != 0 {
            print $"::error::($env.SRC_SHA) is not on ($env.GITHUB_REF_NAME) \(($env.GITHUB_SHA)\)"
            exit 1
          }

      - name: Check the manifest exists
        run: |
          if not ($env.FILE | path exists) {
            print $"::error::($env.FILE) does not exist. Available:"
            for f in (ls apko/*.yaml | get name) { print $f }
            exit 1
          }

      - name: Install apko
        # Pin the release AND its sha256 — chainguard-dev/actions doesn't
        # publish a setup-apko action (only setup-melange), so the manual
        # download stays. Rotate APKO_SHA256 whenever APKO_VERSION bumps;
        # the checksum is authoritative for chainguard-dev/apko releases
        # (see the cosign-signed `checksums.txt` in the same release).
        env:
          APKO_VERSION: v1.4.1
          APKO_SHA256: d72352a2a875440946c05877a2e20eb4ffe6ab785cea8e5dbea942f1d62fd42e
        run: |
          let workdir = mktemp -d
          let asset = $"apko_($env.APKO_VERSION | str trim -l -c 'v')_linux_amd64.tar.gz"
          let tarball = $"($workdir)/($asset)"
          ^curl -sSfL -o $tarball $"https://github.com/chainguard-dev/apko/releases/download/($env.APKO_VERSION)/($asset)"
          let sum = open --raw $tarball | hash sha256
          if $sum != $env.APKO_SHA256 {
            print $"::error::($asset): sha256 ($sum), expected ($env.APKO_SHA256)"
            exit 1
          }
          ^tar xz -C $workdir -f $tarball
          let bin = glob $"($workdir)/**/apko" | where {|f| ($f | path type) == 'file' } | get -o 0
          if $bin == null {
            print "::error::apko binary not found in tarball; contents:"
            ^find $workdir -maxdepth 3
            exit 1
          }
          ^sudo mv $bin /usr/local/bin/apko
          ^apko version

      - name: Does this manifest use the Lago overlay?
        # Manifests opt in by referencing ./repo-local. Everything else skips the
        # role assumption and the download entirely, so the other images pay
        # nothing for this.
        id: overlay
        run: |
          $"needed=(open --raw $env.FILE | str contains 'repo-local')\n" | save -a $env.GITHUB_OUTPUT

      - name: Assume the packages role
        if: steps.overlay.outputs.needed == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Same role build-packages.yaml writes with. OIDC trust is per
          # repository, so a separate read-only role for this job would buy no
          # isolation.
          role-to-assume: ${{ vars.PACKAGES_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync the Lago overlay
        if: steps.overlay.outputs.needed == 'true'
        run: |
          # apk resolves <repo>/<arch>/APKINDEX.tar.gz, which is the layout the
          # bucket already has. The allowlist below is deliberate: apk installs
          # the highest version it can see, so an overlay apk no manifest asks
          # for is either inert (older than Wolfi's) or a silent shadow of
          # Wolfi's (newer). Add an --include line only for a package a manifest
          # really installs from the overlay.
          (^aws s3 sync $"s3://($env.PACKAGES_BUCKET)/os/" ./repo-local/
            --exclude "*"
            --include "*/APKINDEX.tar.gz"
            --include "lago-signing.rsa.pub"
            --include "*/chromium-*.apk"
            --include "*/flink-1.20-*.apk")
          # Fail loudly rather than silently falling back to Wolfi's older
          # package, which would reintroduce the CVEs this overlay exists to fix.
          for f in [./repo-local/lago-signing.rsa.pub ./repo-local/x86_64/APKINDEX.tar.gz ./repo-local/aarch64/APKINDEX.tar.gz] {
            if not ($f | path exists) {
              print $"::error::($f) is missing from the overlay"
              exit 1
            }
          }
          ^du -sh ./repo-local

      - name: Build apko base (${{ env.IMAGE_NAME }}) — one OCI tarball per arch
        # One tarball per arch, not a single `--arch x86_64,aarch64` build:
        # that emits a multi-image archive, and Trivy's tarball reader
        # rejects it ("tarball must contain only a single image"). Building
        # per arch keeps the scan gate on the exact bytes that get pushed —
        # the multi-arch index is assembled from these two below.
        run: |
          for arch in [x86_64 aarch64] {
            ^apko build --arch $arch $env.FILE $"($env.REGISTRY)/($env.IMAGE_NAME):($env.SRC_SHA)" $"image-($arch).tar"
            # apko writes sbom-<arch>.spdx.json next to the tarball on every
            # build. Keep it under a per-arch name so the second pass cannot
            # clobber the first, and so the attest step below can find it.
            mv $"sbom-($arch).spdx.json" $"sbom-($env.IMAGE_NAME)-($arch).spdx.json"
          }
          ls sbom-*.spdx.json | select name size | print

      - name: Stage per-manifest .trivyignore
        # Every manifest can carry its own `.trivyignore.d/<name>` file for
        # CVEs that Trivy flags as fixable but Wolfi hasn't packaged the fix
        # for yet (typical of fast-moving trees like chromium). Trivy's
        # `trivyignores` input requires the path to exist, so we `touch` an
        # empty file for manifests that don't ship one — that keeps the
        # opt-in surface small and the workflow uniform. Stale entries in
        # any file are harmless (Trivy silently ignores non-matching IDs)
        # and should be pruned on the next clean daily rebuild.
        run: |
          mkdir .trivyignore.d
          touch $".trivyignore.d/($env.IMAGE_NAME)"

      - name: Scan x86_64 tarball for HIGH/CRITICAL CVEs (Trivy)
        # Scans the local OCI archive directly, before it ever reaches
        # GHCR. `ignore-unfixed: true` skips CVEs with no upstream fix so
        # builds only break on things we can actually do something about
        # — bumping a Wolfi package or waiting for upstream to ship a
        # patch.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: image-x86_64.tar
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'
          trivyignores: .trivyignore.d/${{ env.IMAGE_NAME }}

      - name: Scan aarch64 tarball for HIGH/CRITICAL CVEs (Trivy)
        # Both arches are gated: Wolfi ships arch-specific builds, so a CVE
        # can be fixed on one and not the other. The vulnerability DB is
        # cached by the previous step, so this pass is cheap.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: image-aarch64.tar
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'
          trivyignores: .trivyignore.d/${{ env.IMAGE_NAME }}

      - name: Login to GHCR
        # GITHUB_TOKEN + `packages: write` is the only credential needed.
        # Writes ~/.docker/config.json, which crane and buildx both read.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        # The vendored setup-crane action handles binary integrity itself
        # (pinned version + published checksum verification inside the
        # action), so we drop the manual curl and rely on it the same way
        # we rely on chainguard-dev/actions/setup-melange elsewhere.
        uses: imjasonh/setup-crane@v0.7
        with:
          version: v0.20.2

      - name: Compare with the published :latest
        # apko is reproducible: a moved per-arch digest = a real package change.
        id: diff
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          mut changed = false
          for p in [[arch platform]; [x86_64 amd64] [aarch64 arm64]] {
            let built = ^crane digest --tarball $"image-($p.arch).tar" | str trim
            let latest = ^crane digest --platform $"linux/($p.platform)" $"($env.IMAGE):latest" | complete
            let published = if $latest.exit_code == 0 { $latest.stdout | str trim } else { 'none' }
            print $"($p.arch): built=($built) published=($published)"
            if $built != $published { $changed = true }
          }
          $"changed=($changed)\n" | save -a $env.GITHUB_OUTPUT
          if not $changed {
            print $"::notice::($env.IMAGE_NAME) is unchanged, nothing to publish"
          }

      - name: Push scan-clean per-arch images to GHCR
        # crane pushes the exact tarballs Trivy scanned — no rebuild, no
        # drift between the scan and what lands in the registry. The
        # per-arch tags make it possible to pull one arch directly when
        # debugging, and to verify the per-arch SBOM attestation.
        if: steps.diff.outputs.changed == 'true'
        id: push
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # Immutable and sortable; `:<sha>` repeats on daily runs. +1000: this
          # workflow counts from 1, and the tags of the matrix build it
          # replaced reached r7x. The offset keeps every new tag above them.
          let tag = $"(date now | date to-timezone UTC | format date '%Y%m%d')-r(($env.GITHUB_RUN_NUMBER | into int) + 1000)"
          $"tag=($tag)\n" | save -a $env.GITHUB_OUTPUT
          for arch in [x86_64 aarch64] {
            ^crane push $"image-($arch).tar" $"($env.IMAGE):($tag)-($arch)"
            ^crane tag $"($env.IMAGE):($tag)-($arch)" $"latest-($arch)"
          }

      - name: Assemble multi-arch index
        # `:<sha>` is set only on a commit's first publish, so it never moves.
        if: steps.diff.outputs.changed == 'true'
        id: index
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.push.outputs.tag }}
        run: |
          mut tags = ['-t' $"($env.IMAGE):($env.TAG)" '-t' $"($env.IMAGE):latest"]
          if (^crane digest $"($env.IMAGE):($env.SRC_SHA)" | complete).exit_code == 0 {
            print $"($env.IMAGE):($env.SRC_SHA) exists, leaving it in place"
          } else {
            $tags = $tags ++ ['-t' $"($env.IMAGE):($env.SRC_SHA)"]
          }
          # The annotation links the index to this run: bump PRs read it.
          (^docker buildx imagetools create ...$tags
            --annotation $"index:dev.getlago.build-run=($env.GITHUB_SERVER_URL)/($env.GITHUB_REPOSITORY)/actions/runs/($env.GITHUB_RUN_ID)"
            $"($env.IMAGE):($env.TAG)-x86_64" $"($env.IMAGE):($env.TAG)-aarch64")
          $"digest=(^crane digest $'($env.IMAGE):($env.TAG)' | str trim)\n" | save -a $env.GITHUB_OUTPUT

      - name: Install cosign
        if: steps.diff.outputs.changed == 'true'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign base image (keyless via GH OIDC)
        # Signs the index digest, which covers every tag pointing at it.
        if: steps.diff.outputs.changed == 'true'
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          ^cosign sign $"($env.REGISTRY)/($env.IMAGE_NAME)@($env.DIGEST)"

      - name: Attach the SBOMs as cosign attestations
        # Per-arch: that is the digest a puller resolves to.
        #
        #   cosign verify-attestation --type spdxjson \
        #     ghcr.io/getlago/<repo>:latest-x86_64 \
        #     --certificate-identity-regexp '^https://github.com/getlago/lago-packages/' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
        if: steps.diff.outputs.changed == 'true'
        env:
          COSIGN_YES: "true"
          TAG: ${{ steps.push.outputs.tag }}
        run: |
          for arch in [x86_64 aarch64] {
            ^cosign attest --predicate $"sbom-($env.IMAGE_NAME)-($arch).spdx.json" --type spdxjson $"($env.REGISTRY)/($env.IMAGE_NAME):($env.TAG)-($arch)"
          }

      - name: Upload the SBOMs as build artifacts
        # Same bytes as the attestation, reachable without cosign — useful when
        # answering "which version of X shipped in this image" from a browser.
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ env.IMAGE_NAME }}
          path: sbom-${{ env.IMAGE_NAME }}-*.spdx.json
          retention-days: 90

      - name: Record the change for the batch run
        # build-bases.yaml cannot read this run's outputs: it downloads this
        # marker to decide if the batch sends base-updated.
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir changed
          touch $"changed/($env.IMAGE_NAME)"

      - name: Upload the change marker
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changed-${{ env.IMAGE_NAME }}
          path: changed/${{ env.IMAGE_NAME }}
          retention-days: 7

  notify:
    # Tells the consumers a base moved; their `base-refresh plan` reads the
    # new digests itself. In a batch, the batch sends one notice for all its
    # images. This run sends its own when nothing else will: started by hand,
    # re-run, or its batch no longer waits for it (deadline, cancel).
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      matrix:
        repository: [getlago/lago-deploy, getlago/lago-infrastructure]
    env:
      # Without it the consumers catch up on their daily run.
      HAS_TOKEN: ${{ secrets.BASE_UPDATE_DISPATCH_TOKEN != '' }}
    steps:
      - uses: hustcer/setup-nu@v3.29
        with:
          version: "0.116.1"

      - name: Does the batch cover this image?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY: ${{ inputs.notify }}
          PARENT: ${{ inputs.parent }}
        run: |
          let parent = $env.PARENT? | default ''
          let send = if $env.NOTIFY == 'true' or ($env.GITHUB_RUN_ATTEMPT | into int) > 1 {
            true
          } else if $parent != '' {
            # The batch reads the change markers only while its wait step runs.
            let id = $parent | split row '.'
            let jobs = ^gh api $"repos/($env.GITHUB_REPOSITORY)/actions/runs/($id.0)/attempts/($id.1)/jobs" | complete
            let wait = if $jobs.exit_code != 0 { 'completed' } else {
              $jobs.stdout | from json | get jobs | where name == 'dispatch' | get steps | flatten
              | where name == 'Wait for the image runs' | get -o 0.status | default 'completed'
            }
            $wait == 'completed'
          } else {
            false
          }
          $"send=($send)\n" | save -a $env.GITHUB_OUTPUT
          print $"notify=($env.NOTIFY) attempt=($env.GITHUB_RUN_ATTEMPT) parent=($parent) -> send=($send)"

      # Cross-repo `contents: write`; GITHUB_TOKEN cannot do it.
      - name: Dispatch base-updated
        if: env.HAS_TOKEN == 'true' && steps.gate.outputs.send == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.BASE_UPDATE_DISPATCH_TOKEN }}
          repository: ${{ matrix.repository }}
          event-type: base-updated
          client-payload: '{"run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
