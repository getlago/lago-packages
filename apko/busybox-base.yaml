# Minimal busybox runtime: sh and the coreutils applets, for example for an
# init container that copies files into a shared volume. Replaces Docker Hub
# `busybox`, which no bot tracks and which lags Wolfi's busybox CVE fixes.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - busybox

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

archs:
  - x86_64
  - aarch64

# No entrypoint: the consumer sets the command.

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.description: Hardened Wolfi-based busybox runtime image
