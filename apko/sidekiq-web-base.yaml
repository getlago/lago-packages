contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - bash
    - busybox
    # Ruby 3.4 matches the pin that lago-sidekiqs' Dockerfile used
    # (ruby:3.4.6-slim) and the Gemfile.lock resolved against.
    - ruby-3.4

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  BUNDLE_WITHOUT: "development test"
  GEM_HOME: /usr/local/bundle
  BUNDLE_PATH: /usr/local/bundle
  PATH: /usr/local/bundle/bin:/usr/bin:/bin:/usr/sbin:/sbin

archs:
  - x86_64
  - aarch64

work-dir: /app

entrypoint:
  command: /app/start.sh

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.licenses: AGPL-3.0
  org.opencontainers.image.description: Hardened Wolfi-based runtime image for sidekiq-web
