contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    # The server dials its database, identity providers and SMTP over TLS.
    - ca-certificates-bundle
    # No tzdata: the binary imports time/tzdata (internal/api/scim), and
    # upstream's scratch image ships none either.

# Upstream's image is `scratch` plus /etc/passwd from a `useradd zitadel`,
# which is uid 1000. The upstream chart sets runAsUser and fsGroup 1000, so
# the same uid keeps this image a drop-in.
accounts:
  groups:
    - groupname: zitadel
      gid: 1000
  users:
    - username: zitadel
      uid: 1000
      gid: 1000
  run-as: 1000

archs:
  - x86_64
  - aarch64

work-dir: /app

# Upstream's final stage has no shell: the chart passes `start`, `init` and
# `setup` as args to this entrypoint.
entrypoint:
  command: /app/zitadel

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.description: Hardened Wolfi-based runtime image for the zitadel server
