contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bash
    - busybox
    - build-base
    - git
    - curl
    - pkgconf
    # Ruby 3.4 matches lago-sidekiqs' Gemfile.lock (bundler 2.6.3,
    # bundled against Ruby 3.4). ruby-3.4-dev + yaml-dev + openssl-dev
    # cover the native extensions in the lockfile — puma, nio4r,
    # json, sidekiq-pro native parts.
    - ruby-3.4
    - ruby-3.4-dev
    - yaml-dev
    - openssl-dev

environment:
  PATH: /usr/local/bin:/usr/bin:/bin

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.description: Wolfi-based builder image for sidekiq-web (ruby-3.4 + headers)
