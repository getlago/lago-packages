contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - bash
    - busybox
    - ruby-4.0
    - libpq
    - jemalloc
    - git
    - postgresql-client
    - pdfcpu
    # Container healthchecks in the OSS docker-compose shell out to curl
    # (`curl -f http://localhost:3000/health`). Wolfi's busybox ships no
    # wget applet, so without this the image has no HTTP client at all.
    - curl

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  BUNDLE_WITHOUT: "development test"
  LD_PRELOAD: /usr/lib/libjemalloc.so.2
  GEM_HOME: /home/nonroot/bundle
  BUNDLE_PATH: /home/nonroot/bundle
  PATH: /home/nonroot/bundle/bin:/usr/bin:/bin:/usr/sbin:/sbin

archs:
  - x86_64
  - aarch64

work-dir: /app

# No `entrypoint:` on purpose. This is a base, and the images built on it run
# several different processes (api, worker, clock, migrate). An ENTRYPOINT here
# is inherited and demotes every downstream `command:` to an argument, which
# silently broke the OSS docker-compose in v1.54.0. Downstream sets CMD.

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.licenses: AGPL-3.0
  org.opencontainers.image.description: Hardened Wolfi-based runtime image for lago-api
