contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - bash
    - busybox
    - nginx

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  # nginx as non-root: cannot bind privileged ports. lago-front's runtime
  # nginx.conf must `listen 8080;` (or higher), and the k8s Service must
  # target 8080 instead of 80. Handled in the caller's Dockerfile.staging +
  # the lago-helm-charts front chart values.
  NGINX_PORT: "8080"

archs:
  - x86_64
  - aarch64

work-dir: /usr/share/nginx/html

entrypoint:
  command: nginx -g "daemon off;"

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.licenses: AGPL-3.0
  org.opencontainers.image.description: Hardened Wolfi-based nginx runtime image for lago-front
