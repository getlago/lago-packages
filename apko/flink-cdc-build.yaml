# Build stages of getlago/lago-infrastructure images/flink-cdc: clone and patch
# flink-cdc, build its Kafka and Postgres pipeline connectors with Maven,
# compile the seed jar, and download the release jars (curl). JDK 11,
# like the runtime.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bash
    - busybox
    - curl
    - openjdk-11
    - git
    - patch
    - maven-3.9

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  JAVA_HOME: /usr/lib/jvm/java-11-openjdk
  PATH: /usr/lib/jvm/java-11-openjdk/bin:/usr/local/bin:/usr/bin:/bin

archs:
  - x86_64
  - aarch64

work-dir: /home/nonroot

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.licenses: AGPL-3.0
  org.opencontainers.image.description: Hardened Wolfi-based JDK11 + Maven build image for the flink-cdc image
