contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bash
    - busybox
    - build-base
    - git
    - curl
    - pkgconf
    - ruby-4.0
    - ruby-4.0-dev
    - yaml-dev
    - postgresql-dev
    - postgresql-client
    - nodejs
    - rust
    - clang-19
    - libclang-cpp-19
    - libcxx1-19

environment:
  PATH: /usr/local/bin:/usr/bin:/bin:/root/.cargo/bin

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.description: Wolfi-based builder image for lago-api (ruby-4.0 + headers + rust/cargo)
