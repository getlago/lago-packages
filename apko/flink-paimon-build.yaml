# Build stages of infra/flink-paimon (lago-infrastructure images/flink-paimon).
# They recompile patched Paimon and flink-connector-jdbc classes, swap them
# into the jars with `jar uf`, and build the leg-3 tools with `jar cf`. The
# image tests (images/flink-paimon/test) run their Java checks on it too.
#
# No download tool: the consumer fetches every jar with `ADD --checksum`.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bash
    - busybox
    # Full JDK: javac and jar. Java 17 to match flink-paimon-base's JRE.
    - openjdk-17

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  # No Wolfi JDK package installs /usr/bin/java or /usr/bin/javac.
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk
  PATH: /usr/lib/jvm/java-17-openjdk/bin:/usr/local/bin:/usr/bin:/bin
  LANG: C.UTF-8

archs:
  - x86_64
  - aarch64

work-dir: /home/nonroot

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.licenses: AGPL-3.0
  org.opencontainers.image.description: Hardened Wolfi-based JDK 17 build image for infra/flink-paimon
