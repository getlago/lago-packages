# Build stages of getlago/lago-infrastructure images/flink-paimon: download the
# connector jars (curl), compile the patched Paimon and JDBC classes
# and zip them back into their jars, and compile the leg-3 jar. JDK 17, like
# the runtime.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bash
    - busybox
    - curl
    - openjdk-17
    - zip

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk
  PATH: /usr/lib/jvm/java-17-openjdk/bin:/usr/local/bin:/usr/bin:/bin

archs:
  - x86_64
  - aarch64

work-dir: /home/nonroot

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.licenses: AGPL-3.0
  org.opencontainers.image.description: Hardened Wolfi-based JDK17 build image for the flink-paimon image
