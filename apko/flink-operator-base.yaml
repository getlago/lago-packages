# Runtime of the Flink Kubernetes Operator image (operator and webhook).
# Replaces ghcr.io/apache/flink-kubernetes-operator, which is Ubuntu 22.04
# with a Temurin JRE.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    # The operator dials the Kubernetes API and the JobManager REST endpoints.
    - ca-certificates-bundle
    - tzdata
    # docker-entrypoint.sh is bash and calls uname.
    - bash
    - busybox
    - openjdk-17-jre
    # docker-entrypoint.sh preloads it unless DISABLE_JEMALLOC=true, as the
    # upstream image does. The image build points the entrypoint at
    # /usr/lib/libjemalloc.so.2.
    - libjemalloc2

# Same uid/gid as the upstream image: the chart's securityContext and the
# operator's defaults assume 9999.
accounts:
  groups:
    - groupname: flink
      gid: 9999
  users:
    - username: flink
      uid: 9999
      gid: 9999
      homedir: /opt/flink
  run-as: 9999

paths:
  # Upstream chowns $FLINK_HOME to flink. The image build adds plugins/ and
  # operator-lib/ there.
  - path: /opt/flink
    type: directory
    permissions: 0o755
    uid: 9999
    gid: 9999
  - path: /flink-kubernetes-operator
    type: directory
    permissions: 0o755
    uid: 9999
    gid: 9999

environment:
  FLINK_HOME: /opt/flink
  FLINK_PLUGINS_DIR: /opt/flink/plugins
  OPERATOR_LIB: /opt/flink/operator-lib
  # No Wolfi JRE package installs /usr/bin/java; the entrypoint runs `java`
  # from PATH.
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk
  PATH: /usr/lib/jvm/java-17-openjdk/bin:/usr/local/bin:/usr/bin:/bin
  # Java 17 takes its default charset from the locale.
  LANG: C.UTF-8

archs:
  - x86_64
  - aarch64

work-dir: /flink-kubernetes-operator

entrypoint:
  command: /docker-entrypoint.sh
cmd: help

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.description: Hardened Wolfi-based JRE 17 runtime image for the Flink Kubernetes Operator
