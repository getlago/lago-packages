# Runtime for the lago-data FastAPI service (lago-data `api/`, ECR
# lago-data-api). Replaces `python:3.11-slim-bookworm` + apt-get, whose
# util-linux, zlib and system setuptools (with its vendored jaraco.context)
# were open findings.
#
# The service is one `fastapi run` (uvicorn) process. It opens outbound
# connections to Postgres (asyncpg) and Redis and serves HTTP. Every locked
# runtime package ships a manylinux wheel, so it needs the interpreter and CA
# certificates and nothing else. No shell, no busybox, no uv.
#
# uid 65532 cannot bind a port below 1024: the image listens on 8080.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    # Must match data-api-build.yaml: the copied venv records this path in
    # pyvenv.cfg and in each console script's shebang. Moves together with
    # requires-python in lago-data api/pyproject.toml.
    - python-3.11

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  PATH: /api/.venv/bin:/usr/local/bin:/usr/bin:/bin
  PYTHONUNBUFFERED: "1"
  # No .pyc writes: the code and the venv belong to root, so the cache would
  # only produce permission noise on import.
  PYTHONDONTWRITEBYTECODE: "1"
  LANG: C.UTF-8

archs:
  - x86_64
  - aarch64

work-dir: /api

# No entrypoint: the consumer Dockerfile sets it.

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.licenses: AGPL-3.0
  org.opencontainers.image.description: Hardened Wolfi-based python-3.11 runtime image for the lago-data API
