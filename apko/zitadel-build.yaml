contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    # Docker's `RUN <cmd>` form shells out via /bin/sh, and upstream's nx
    # targets run their steps through `bash -c`.
    - busybox
    - bash
    # The build clones zitadel at a tag, and the ldflags read the commit with
    # `git rev-parse`.
    - git
    # console/scripts/install-proto-plugins.sh downloads protoc-gen-grpc-web,
    # protoc-gen-js and protoc-gen-openapiv2 with curl. It pins each version
    # and checks a SHA-256 before it installs the file.
    - curl
    # go-1.26 matches upstream's go.mod (`go 1.26.0`). The Go build needs no C
    # toolchain (CGO_ENABLED=0); build-base below is for node-gyp.
    - go-1.26
    # The server embeds the Angular console, and `nx` drives the whole build,
    # so node and pnpm are needed even for the Go binary. nodejs-24, as in
    # zitadel-login-build, which builds the same zitadel tree: upstream CI uses
    # node 22, but Wolfi's nodejs-22 lags the fixes that Trivy gates on.
    # Wolfi's pnpm sidesteps corepack, which
    # would enforce zitadel's `packageManager` pin and fail on any skew.
    - nodejs-24
    - pnpm
    # node-gyp fallbacks in the console's dependency tree compile with these.
    - build-base

environment:
  PATH: /usr/local/bin:/usr/bin:/bin
  PNPM_HOME: /root/.local/share/pnpm

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.description: Wolfi-based builder image for the zitadel server (go-1.26, nodejs-24, pnpm, git)
