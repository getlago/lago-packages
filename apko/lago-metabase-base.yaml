contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - bash
    - busybox
    # OpenJDK 21 JRE — metabase 0.50+ requires Java 21 LTS.
    - openjdk-21-jre
    # fontconfig — Java's AWT / SkiaSharp needs it to enumerate fonts for
    # chart PNG/PDF export. Without it Metabase falls back to a monospace
    # blob and dashboard exports render unreadably.
    - fontconfig
    # Fonts — same set gotenberg-base uses so Metabase's chart exports
    # render identically to the rest of the PDF pipeline (Noto covers most
    # scripts, DejaVu ships as fallback via font-liberation).
    - font-liberation
    - font-noto
    - font-noto-cjk
    - font-noto-emoji

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PATH: /usr/local/bin:/usr/bin:/bin
  # Metabase reads these to size the JVM. Defaults picked to match the pod's
  # 2Gi limit in charts/lago-base — override at container level (via helm
  # `extraEnv`) if the k8s memory request grows.
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
  # Where the metabase JAR gets copied by the consumer Dockerfile.
  MB_JETTY_PORT: "3000"
  # /plugins is writable so metabase can drop optional driver JARs there
  # at runtime; the k8s pod mounts an emptyDir there when read-only root
  # filesystem is on.
  MB_PLUGINS_DIR: /home/nonroot/plugins

archs:
  - x86_64
  - aarch64

work-dir: /home/nonroot

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.licenses: AGPL-3.0
  org.opencontainers.image.description: Hardened Wolfi-based JRE runtime for repackaging upstream metabase JAR
