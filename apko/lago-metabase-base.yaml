contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - bash
    - busybox
    # OpenJDK 21 JRE — metabase 0.50+ requires Java 21 LTS.
    - openjdk-21-jre
    # fontconfig — Java's AWT / SkiaSharp needs it to enumerate fonts for
    # chart PNG/PDF export. Without it Metabase falls back to a monospace
    # blob and dashboard exports render unreadably.
    - fontconfig
    # Fonts — same set gotenberg-base uses so Metabase's chart exports
    # render identically to the rest of the PDF pipeline (Noto covers most
    # scripts, DejaVu ships as fallback via font-liberation).
    - font-liberation
    - font-noto
    - font-noto-cjk
    - font-noto-emoji

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # openjdk-21-jre installs under /usr/lib/jvm/java-21-openjdk and creates no
  # symlink in /usr/bin, so the JVM bin directory has to be on PATH here. Without
  # it `java` is unresolvable by name and any `CMD ["java", ...]` in a consumer
  # image dies at container init with exit 127, before a single log line.
  PATH: /usr/lib/jvm/java-21-openjdk/bin:/usr/local/bin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  # Metabase reads this to size the JVM. Defaults picked to match the pod's
  # 2Gi limit in charts/lago-base — override at container level (via helm
  # `extraEnv`) if the k8s memory request grows.
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
  MB_JETTY_PORT: "3000"
  # MB_PLUGINS_DIR must point at a WRITABLE directory. Metabase asserts this
  # at startup and refuses to boot without one:
  #
  #   Metabase Initialization FAILED: Assert failed: Metabase cannot write to
  #   temporary directory. Please set MB_PLUGINS_DIR to a writable directory
  #
  # Leaving it unset does not keep the directory out of the image, it only
  # stops the container from starting - on a read-only root filesystem the
  # fallback to a temp directory fails too.
  #
  # The security intent still holds, it just needs a different lever: point it
  # at an EMPTY tmpfs / emptyDir. Metabase v0.50+ embeds every first-party
  # database driver (postgres, mysql, redshift, snowflake, bigquery, …) inside
  # the uberjar, so an empty plugins directory loads nothing and adds no
  # runtime code-load surface outside the SBOM. If we ever need a community
  # driver, bake it into the consumer Dockerfile alongside metabase.jar so
  # every loaded class is scanned.
  MB_PLUGINS_DIR: /tmp/plugins

archs:
  - x86_64
  - aarch64

work-dir: /home/nonroot

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.licenses: AGPL-3.0
  org.opencontainers.image.description: Hardened Wolfi-based JRE runtime for repackaging upstream metabase JAR
