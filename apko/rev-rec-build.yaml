contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bash
    - busybox
    - build-base
    - git
    - curl
    - python-3.13
    - python-3.13-dev
    - uv

environment:
  PATH: /usr/local/bin:/usr/bin:/bin
  # See data-agent-build.yaml for the full rationale. rev_rec's pyproject sets
  # `[tool.uv] python-preference = "only-managed"`, which pulls a CPython that
  # Wolfi cannot patch — the exact thing this migration exists to stop. The
  # env var overrides the project setting; the pyproject line should be
  # dropped in the same change so the two cannot disagree silently.
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON: /usr/bin/python3.13

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.description: Wolfi-based builder image for rev-rec (python-3.13 + uv)
