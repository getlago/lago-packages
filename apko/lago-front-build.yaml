contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bash
    - busybox
    - build-base
    - git
    - curl
    - python3
    - nodejs
    - npm
    - pnpm

environment:
  PATH: /usr/local/bin:/usr/bin:/bin
  # pnpm content-addressable store shared across builds via a buildx cache
  # mount in Dockerfile.staging — kept out of the base image itself so we
  # don't ship a stale store.
  PNPM_HOME: /root/.local/share/pnpm

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.description: Wolfi-based builder image for lago-front (nodejs + pnpm)
