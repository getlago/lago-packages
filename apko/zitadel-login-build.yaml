contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bash
    - busybox
    - build-base
    # The build shallow-clones zitadel at a pinned tag and applies
    # lago-login.patch, so both git and patch are build-time requirements.
    - git
    - patch
    # `nodejs` is not a package in Wolfi — the major version is part of the
    # name. Must track the runtime major in zitadel-login-base.yaml.
    - nodejs-22
    - npm
    # Wolfi ships pnpm directly, so the consumer Dockerfile no longer needs
    # `corepack enable && corepack prepare`. Corepack would also enforce
    # zitadel's `packageManager` pin and fail on any version skew; installing
    # pnpm as a package sidesteps that entirely.
    - pnpm

environment:
  PATH: /usr/local/bin:/usr/bin:/bin
  PNPM_HOME: /root/.local/share/pnpm

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: https://github.com/getlago/lago-packages
  org.opencontainers.image.description: Wolfi-based builder image for zitadel-login (nodejs-22 + pnpm + git/patch)
